    <title>Alphapp AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': 'rgb(var(--color-primary) / <alpha-value>)',
              'primary-focus': 'rgb(var(--color-primary-focus) / <alpha-value>)',
              'primary-content': 'rgb(var(--color-primary-content) / <alpha-value>)',
              'accent': 'rgb(var(--color-accent) / <alpha-value>)',
              'accent-focus': 'rgb(var(--color-accent-focus) / <alpha-value>)',
              'accent-content': 'rgb(var(--color-accent-content) / <alpha-value>)',
              'highlight': 'rgb(var(--color-highlight) / <alpha-value>)',
              
              'background': 'rgb(var(--color-background) / <alpha-value>)',
              'surface': 'rgb(var(--color-surface) / <alpha-value>)',
              'border': 'rgb(var(--color-border) / <alpha-value>)',
              
              'text-primary': 'rgb(var(--color-text-primary) / <alpha-value>)',
              'text-secondary': 'rgb(var(--color-text-secondary) / <alpha-value>)',
              'text-tertiary': 'rgb(var(--color-text-tertiary) / <alpha-value>)',

              // System Colors
              'success': 'rgb(var(--color-success) / <alpha-value>)',
              'error': 'rgb(var(--color-error) / <alpha-value>)',
              'warning': 'rgb(var(--color-warning) / <alpha-value>)',
              'info': 'rgb(var(--color-info) / <alpha-value>)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            boxShadow: {
              'glow-primary': '0 0 15px 5px rgba(var(--color-primary), 0.3)',
              'glow-highlight': '0 0 15px 5px rgba(var(--color-highlight), 0.3)',
            },
            dropShadow: {
               'text-glow-primary': '0 0 8px rgba(var(--color-primary), 0.6)',
               'text-glow-highlight': '0 0 8px rgba(var(--color-highlight), 0.6)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'toast-in': 'toastIn 0.3s ease-out forwards',
              'toast-out': 'toastOut 0.3s ease-in forwards',
              'progress-bar': 'progressBar linear forwards',
              'blink': 'blink 1s step-end infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              toastIn: {
                '0%': { opacity: 0, transform: 'translateY(1rem) scale(0.95)' },
                '100%': { opacity: 1, transform: 'translateY(0) scale(1)' },
              },
              toastOut: {
                '0%': { opacity: 1, transform: 'translateY(0) scale(1)' },
                '100%': { opacity: 0, transform: 'translateY(0.5rem) scale(0.95)' },
              },
              progressBar: {
                '0%': { transform: 'scaleX(1)' },
                '100%': { transform: 'scaleX(0)' },
              },
              blink: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0 },
              }
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  /* Style for details/summary accordion */

  details > summary::-webkit-details-marker {

    font-size: 0.8em;
    transition: transform 0.2s ease-in-out;
    display: inline-block;
  }

  .sr-only {
